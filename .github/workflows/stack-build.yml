---
name: stack-build
on:
  push:
    branches: main
  pull_request:
    branches: main

permissions:
  contents: read

jobs:
  generate:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      stack-yamls: ${{ steps.generate.outputs.stack-yamls }}
    steps:
      - uses: actions/checkout@v4
      - id: generate
        uses: freckle/stack-action/generate-matrix@v5

  build:
    name: ${{ matrix.stack-yaml }} / ${{ matrix.os }}
    needs: generate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 pinned, macos-latest breaks GHC linking
        # https://github.com/actions/runner-images/issues/14940
        os: [ubuntu-latest, macos-15, windows-latest]
        stack-yaml: ${{ fromJSON(needs.generate.outputs.stack-yamls) }}
    env:
      STACK_YAML: ${{ matrix.stack-yaml }}
    steps:
      - uses: actions/checkout@v4

      - uses: freckle/stack-action@v5

      - name: Check cabal file
        run: stack exec -- cabal check
        continue-on-error: true

      - name: Build documentation
        run: stack haddock
...
